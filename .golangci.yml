---
version: "2"
linters:
  default: all
  disable:
    # it should improve to support more known patterns
    - varnamelen
    # why even we have this?
    - nolintlint
    - depguard
    - revive
    - gosec
    - noinlineerr
    # deprecated aliases, `default: all` already enables their successors
    # (exhaustruct_v5, gomodguard_v2, wsl_v5).
    - exhaustruct
    - gomodguard
    - wsl
